<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HSK 4 — интерактивная тетрадь</title><style>body{margin:0;background:#fff8fd;color:#3d2b47;font:16px system-ui,sans-serif}header{background:linear-gradient(110deg,#b55a9a,#7052a6);color:white;padding:24px max(16px,calc((100vw - 900px)/2))}main{max-width:900px;margin:auto;padding:18px}a{color:#8b4385}.panel{background:white;border:1px solid #e8d7e9;border-radius:18px;padding:18px;margin:15px 0;box-shadow:0 5px 20px #66336609}button,select,input{font:inherit;border-radius:10px;padding:11px;border:1px solid #d9bfdc;background:white;color:#3d2b47}button{cursor:pointer}button:active{transform:scale(.98)}.primary{background:#8d4e93;color:white}.row{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}.word{font-size:27px}.muted{color:#76687c}.answer{font-weight:650;min-height:24px}.ok{color:#197442}.bad{color:#b33e4b}.question{padding:13px 0;border-bottom:1px solid #eee}.question:last-child{border:0}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:7px;margin:8px 0}.options button{min-height:48px}.options button:disabled{opacity:.6}.progress{background:#f1e3f2;border-radius:20px;height:12px;overflow:hidden}.fill{background:#9253a5;height:100%;transition:width .2s}.nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(75px,1fr));gap:7px}.nav button.active{background:#f2dced;border-color:#ae78aa;font-weight:700}input{max-width:100%;box-sizing:border-box}.small{font-size:13px}</style></head><body><header><h1>🌸 HSK 4 · Интерактивная тетрадь</h1><p>20 уроков · задания с проверкой · аудирование · прогресс</p><a style="color:white" href="./">← Вернуться в студию</a></header><main><p class="muted small">Самостоятельные упражнения по лексике HSK 4. Это не дословный перенос заданий HSK Standard Course.</p><div class="panel"><h3>Выбери урок</h3><div id="nav" class="nav"></div></div><div class="panel"><h2 id="heading"></h2><div id="progressText" class="muted"></div><div class="progress"><div id="fill" class="fill"></div></div><div class="row"><button id="mode1" class="primary">✍️ Перевод</button><button id="mode2">🎧 Аудирование</button><button id="mode3">🀄 Письмо</button></div><div id="task"></div></div></main><script>const DATA=[{"title":"法律","words":[{"h":"法律","p":"fǎlǜ","r":"закон"},{"h":"规定","p":"guīdìng","r":"правило"},{"h":"社会","p":"shèhuì","r":"общество"},{"h":"责任","p":"zérèn","r":"ответственность"},{"h":"遵守","p":"zūnshǒu","r":"соблюдать"}]},{"title":"朋友","words":[{"h":"朋友","p":"péngyou","r":"друг"},{"h":"理解","p":"lǐjiě","r":"понимать"},{"h":"帮助","p":"bāngzhù","r":"помогать"},{"h":"联系","p":"liánxì","r":"поддерживать связь"},{"h":"信任","p":"xìnrèn","r":"доверять"}]},{"title":"旅行","words":[{"h":"旅行","p":"lǚxíng","r":"путешествие"},{"h":"安排","p":"ānpái","r":"планировать"},{"h":"出发","p":"chūfā","r":"отправляться"},{"h":"到达","p":"dàodá","r":"прибывать"},{"h":"行李","p":"xíngli","r":"багаж"}]},{"title":"健康","words":[{"h":"健康","p":"jiànkāng","r":"здоровье"},{"h":"锻炼","p":"duànliàn","r":"тренироваться"},{"h":"习惯","p":"xíguàn","r":"привычка"},{"h":"休息","p":"xiūxi","r":"отдыхать"},{"h":"精神","p":"jīngshen","r":"энергия"}]},{"title":"工作","words":[{"h":"工作","p":"gōngzuò","r":"работа"},{"h":"经验","p":"jīngyàn","r":"опыт"},{"h":"负责","p":"fùzé","r":"отвечать за"},{"h":"任务","p":"rènwu","r":"задача"},{"h":"完成","p":"wánchéng","r":"завершить"}]},{"title":"学习","words":[{"h":"学习","p":"xuéxí","r":"учиться"},{"h":"复习","p":"fùxí","r":"повторять"},{"h":"提高","p":"tígāo","r":"повышать"},{"h":"知识","p":"zhīshi","r":"знания"},{"h":"进步","p":"jìnbù","r":"прогресс"}]},{"title":"家庭","words":[{"h":"家庭","p":"jiātíng","r":"семья"},{"h":"照顾","p":"zhàogù","r":"заботиться"},{"h":"父母","p":"fùmǔ","r":"родители"},{"h":"关系","p":"guānxi","r":"отношения"},{"h":"支持","p":"zhīchí","r":"поддерживать"}]},{"title":"购物","words":[{"h":"购物","p":"gòuwù","r":"покупки"},{"h":"价格","p":"jiàgé","r":"цена"},{"h":"质量","p":"zhìliàng","r":"качество"},{"h":"选择","p":"xuǎnzé","r":"выбирать"},{"h":"合适","p":"héshì","r":"подходящий"}]},{"title":"天气","words":[{"h":"天气","p":"tiānqì","r":"погода"},{"h":"温度","p":"wēndù","r":"температура"},{"h":"变化","p":"biànhuà","r":"изменение"},{"h":"影响","p":"yǐngxiǎng","r":"влиять"},{"h":"舒服","p":"shūfu","r":"комфортный"}]},{"title":"文化","words":[{"h":"文化","p":"wénhuà","r":"культура"},{"h":"传统","p":"chuántǒng","r":"традиция"},{"h":"历史","p":"lìshǐ","r":"история"},{"h":"节日","p":"jiérì","r":"праздник"},{"h":"活动","p":"huódòng","r":"мероприятие"}]},{"title":"城市","words":[{"h":"城市","p":"chéngshì","r":"город"},{"h":"交通","p":"jiāotōng","r":"транспорт"},{"h":"环境","p":"huánjìng","r":"окружающая среда"},{"h":"方便","p":"fāngbiàn","r":"удобный"},{"h":"附近","p":"fùjìn","r":"поблизости"}]},{"title":"食物","words":[{"h":"食物","p":"shíwù","r":"еда"},{"h":"味道","p":"wèidào","r":"вкус"},{"h":"新鲜","p":"xīnxiān","r":"свежий"},{"h":"尝","p":"cháng","r":"пробовать"},{"h":"菜单","p":"càidān","r":"меню"}]},{"title":"交流","words":[{"h":"交流","p":"jiāoliú","r":"общаться"},{"h":"表达","p":"biǎodá","r":"выражать"},{"h":"解释","p":"jiěshì","r":"объяснять"},{"h":"意见","p":"yìjiàn","r":"мнение"},{"h":"同意","p":"tóngyì","r":"соглашаться"}]},{"title":"时间","words":[{"h":"时间","p":"shíjiān","r":"время"},{"h":"及时","p":"jíshí","r":"вовремя"},{"h":"准时","p":"zhǔnshí","r":"точно вовремя"},{"h":"提前","p":"tíqián","r":"заранее"},{"h":"计划","p":"jìhuà","r":"план"}]},{"title":"情绪","words":[{"h":"情绪","p":"qíngxù","r":"эмоции"},{"h":"紧张","p":"jǐnzhāng","r":"нервничать"},{"h":"高兴","p":"gāoxìng","r":"радоваться"},{"h":"担心","p":"dānxīn","r":"беспокоиться"},{"h":"放松","p":"fàngsōng","r":"расслабляться"}]},{"title":"科技","words":[{"h":"科技","p":"kējì","r":"технологии"},{"h":"网络","p":"wǎngluò","r":"интернет"},{"h":"信息","p":"xìnxī","r":"информация"},{"h":"使用","p":"shǐyòng","r":"использовать"},{"h":"发展","p":"fāzhǎn","r":"развитие"}]},{"title":"运动","words":[{"h":"运动","p":"yùndòng","r":"спорт"},{"h":"比赛","p":"bǐsài","r":"соревнование"},{"h":"坚持","p":"jiānchí","r":"упорно продолжать"},{"h":"参加","p":"cānjiā","r":"участвовать"},{"h":"成功","p":"chénggōng","r":"успех"}]},{"title":"自然","words":[{"h":"自然","p":"zìrán","r":"природа"},{"h":"保护","p":"bǎohù","r":"защищать"},{"h":"动物","p":"dòngwù","r":"животное"},{"h":"植物","p":"zhíwù","r":"растение"},{"h":"空气","p":"kōngqì","r":"воздух"}]},{"title":"梦想","words":[{"h":"梦想","p":"mèngxiǎng","r":"мечта"},{"h":"目标","p":"mùbiāo","r":"цель"},{"h":"努力","p":"nǔlì","r":"стараться"},{"h":"机会","p":"jīhuì","r":"возможность"},{"h":"实现","p":"shíxiàn","r":"осуществить"}]},{"title":"复习","words":[{"h":"总结","p":"zǒngjié","r":"подводить итог"},{"h":"掌握","p":"zhǎngwò","r":"овладеть"},{"h":"运用","p":"yùnyòng","r":"применять"},{"h":"比较","p":"bǐjiào","r":"сравнивать"},{"h":"继续","p":"jìxù","r":"продолжать"}]}];let lesson=0,mode=0;let scores={};try{scores=JSON.parse(localStorage.getItem('hsk4-workbook-v1')||'{}')}catch(e){}const el=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('hsk4-workbook-v1',JSON.stringify(scores));}function speak(t){if(!window.speechSynthesis){alert('Озвучивание не поддерживается браузером');return;}const synth=speechSynthesis;synth.cancel();const voices=synth.getVoices();const voice=voices.find(v=>/^zh[-_](CN|Hans)/i.test(v.lang))||voices.find(v=>/^zh/i.test(v.lang));const u=new SpeechSynthesisUtterance(t);if(voice)u.voice=voice;u.lang=voice?.lang||'zh-CN';u.rate=.8;u.onerror=e=>{if(!['canceled','interrupted'].includes(e.error))alert('Проверь китайский голос в настройках телефона: '+e.error)};synth.speak(u);if(synth.paused)synth.resume();}function key(i){return lesson+':'+mode+':'+i;}function check(i,val){const w=DATA[lesson].words[i];const correct=mode===2?w.h:w.h;const good=val.trim()===correct;scores[key(i)]=good;save();el('fb'+i).innerHTML=good?'<span class="ok">✓ Правильно!</span>':'<span class="bad">Правильный ответ: '+esc(w.h)+' ('+esc(w.p)+')</span>';updateProgress();}function choose(i,v){check(i,v);document.querySelectorAll('[data-q="'+i+'"]').forEach(b=>b.disabled=true);}function updateProgress(){let n=DATA[lesson].words.length;let done=Array.from({length:n},(_,i)=>scores[key(i)]===true).filter(Boolean).length;el('progressText').textContent='Правильно выполнено: '+done+' из '+n;el('fill').style.width=(100*done/n)+'%';}function render(){el('nav').innerHTML=DATA.map((d,i)=>'<button class="'+(i===lesson?'active':'')+'" onclick="lesson='+i+';render()">'+(i+1)+'</button>').join('');el('heading').textContent='Урок '+(lesson+1)+' · '+DATA[lesson].title;for(let j=0;j<3;j++)el('mode'+(j+1)).className=j===mode?'primary':'';let words=DATA[lesson].words;el('task').innerHTML=words.map((w,i)=>{let options=[w,...words.filter((_,k)=>k!==i).slice(0,3)].sort((a,b)=>a.h.localeCompare(b.h));if(mode===0)return '<div class="question"><b>'+(i+1)+'. Переведи на китайский: '+esc(w.r)+'</b><div class="options">'+options.map(o=>'<button data-q="'+i+'" onclick="choose('+i+',\''+o.h+'\')">'+esc(o.h)+'</button>').join('')+'</div><p class="answer" id="fb'+i+'"></p></div>';if(mode===1)return '<div class="question"><b>'+(i+1)+'. Прослушай и выбери слово</b><div class="row"><button onclick="speak(DATA[lesson].words['+i+'].h)">🔊 Прослушать</button></div><div class="options">'+options.map(o=>'<button data-q="'+i+'" onclick="choose('+i+',\''+o.h+'\')">'+esc(o.h)+'</button>').join('')+'</div><p class="answer" id="fb'+i+'"></p></div>';return '<div class="question"><b>'+(i+1)+'. Напиши иероглифами: '+esc(w.r)+'</b><p class="muted">'+esc(w.p)+'</p><div class="row"><input id="input'+i+'" placeholder="Введите китайское слово" autocomplete="off"><button onclick="check('+i+',el(\'input'+i+'\').value)">Проверить</button><button onclick="speak(DATA[lesson].words['+i+'].h)">🔊</button></div><p class="answer" id="fb'+i+'"></p></div>'}).join('');updateProgress();}for(let i=0;i<3;i++)el('mode'+(i+1)).onclick=()=>{mode=i;render()};try{speechSynthesis.getVoices()}catch(e){}render();</script></body></html>
