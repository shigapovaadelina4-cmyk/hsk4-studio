name: Verify HSK 4A flashcards
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  vocabulary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate scripts and flashcards
        run: node scripts/verify-vocab.mjs && node scripts/verify-workbook.mjs
